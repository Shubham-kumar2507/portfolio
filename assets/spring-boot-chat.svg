<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d084;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b21ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff1654;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffb800;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="500" height="400" fill="url(#bgGradient)"/>
  
  <!-- Chat bubble circles for decoration -->
  <circle cx="80" cy="100" r="40" fill="rgba(255,255,255,0.15)"/>
  <circle cx="420" cy="120" r="50" fill="rgba(255,255,255,0.08)"/>
  <circle cx="100" cy="320" r="35" fill="rgba(255,255,255,0.1)"/>
  <circle cx="380" cy="280" r="45" fill="rgba(255,255,255,0.07)"/>
  
  <!-- Chat interface representation -->
  <g transform="translate(50, 80)">
    <!-- Chat window background -->
    <rect width="400" height="260" rx="20" fill="rgba(255,255,255,0.95)"/>
    
    <!-- Chat messages -->
    <g>
      <!-- Bot message 1 -->
      <rect x="20" y="30" width="120" height="40" rx="15" fill="#e8f5ff"/>
      <text x="30" y="58" font-family="Arial" font-size="12" fill="#333">Hello! 👋</text>
      
      <!-- User message 1 -->
      <rect x="260" y="80" width="120" height="40" rx="15" fill="url(#accentGradient)"/>
      <text x="275" y="108" font-family="Arial" font-size="12" fill="white">Hi there! 😊</text>
      
      <!-- Bot message 2 -->
      <rect x="20" y="130" width="180" height="40" rx="15" fill="#e8f5ff"/>
      <text x="30" y="158" font-family="Arial" font-size="12" fill="#333">How can I help?</text>
      
      <!-- Typing indicator -->
      <circle cx="40" cy="200" r="4" fill="#666">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="55" cy="200" r="4" fill="#666">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
      </circle>
      <circle cx="70" cy="200" r="4" fill="#666">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.4s"/>
      </circle>
    </g>
    
    <!-- Input field -->
    <g>
      <rect x="20" y="210" width="360" height="35" rx="10" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
      <text x="30" y="231" font-family="Arial" font-size="12" fill="#999">Type your message...</text>
      <!-- Send button -->
      <circle cx="370" cy="227.5" r="12" fill="url(#accentGradient)"/>
      <text x="365" y="232" font-family="Arial" font-size="16" fill="white">→</text>
    </g>
  </g>
  
  <!-- Floating squares for geometric animation -->
  <rect x="30" y="30" width="60" height="60" rx="12" fill="rgba(255,255,255,0.1)">
    <animate attributeName="y" values="30;50;30" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="30;40;30" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="410" y="320" width="50" height="50" rx="10" fill="rgba(255,255,255,0.08)">
    <animate attributeName="y" values="320;300;320" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="410;390;410" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
